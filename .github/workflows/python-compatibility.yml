name: SEO Engineering Linux Python compatibility

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - name: Check out exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/mohammadAliKeshavarzSarkar/SEO-Engineering.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install pinned setup-python action
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6 tag SHA inspected 2026-11-21
        with:
          python-version: ${{ matrix.python-version }}
      - name: Execute full offline repository and portable-package acceptance
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python -c 'import zlib; print("zlib", zlib.ZLIB_RUNTIME_VERSION)'
          python scripts/verify_release.py > "$RUNNER_TEMP/verification.json"
          python - "$RUNNER_TEMP/verification.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding="utf-8"))
          assert r["behavioral_evaluations"] == "not_run"
          assert r["external_installation"] == "not_run"
          assert all(x["pass"] for x in r["checks"])
          print("Offline regression and package relocation passed; external agents not tested")
          PY
      - name: Confirm no release action
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("docs/01-foundations/distribution-version.json").read_text())
          assert m["stable_release"] is False and m["behavioral_validation"]=="not_run"
          assert m["distribution_approval"]=="pending"
          print("Development-only compatibility run; no deployment or release")
          PY
