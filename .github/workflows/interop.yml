name: Optional crawl evidence compatibility

on:
  push:
    branches: [main]
    paths:
      - 'interop/**'
      - '.github/workflows/interop.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact consumer and producer revisions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/mohammadAliKeshavarzSarkar/SEO-Engineering.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          producer="$RUNNER_TEMP/websitebotscroll-pinned"
          git init "$producer"
          git -C "$producer" remote add origin https://github.com/mohammadAliKeshavarzSarkar/WebsiteBotScroll.git
          git -C "$producer" fetch --depth=1 origin bd45aa69c141deffed50c8d2ea57e28cea552cb8
          git -C "$producer" checkout --detach FETCH_HEAD
          test "$(git -C "$producer" rev-parse HEAD)" = bd45aa69c141deffed50c8d2ea57e28cea552cb8
      - name: Install optional dependencies and exercise independent consumer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/interop-venv"
          py="$RUNNER_TEMP/interop-venv/bin/python"
          "$py" -m pip install -r interop/requirements-compatibility.txt
          "$py" --version
          "$py" -m pip freeze
          WBS_FIXTURE_ROOT="$RUNNER_TEMP/websitebotscroll-pinned" "$py" -m unittest interop.test_crawl_evidence interop.test_verify_exchange -v
      - name: Verify local CLI receipt and no-overwrite contract
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/interop-venv/bin/python"
          contract="$RUNNER_TEMP/websitebotscroll-pinned/packages/evidence-contract"
          "$py" interop/validate_crawl_evidence.py --schema "$contract/schema/seo-crawl-evidence/0.1.0/schema.json" --input "$contract/fixtures/valid/complete-page.json" --output "$RUNNER_TEMP/valid-receipt.json"
          status=0
          "$py" interop/validate_crawl_evidence.py --schema "$contract/schema/seo-crawl-evidence/0.1.0/schema.json" --input "$contract/fixtures/invalid/duplicate-structural-property.json" --output "$RUNNER_TEMP/invalid-receipt.json" || status=$?
          test "$status" = 2
          "$py" -c 'import json,sys; a,b=map(lambda p:json.load(open(p)),sys.argv[1:]); assert a["status"]=="valid" and not a["actual_exchange_verified"]; assert b["status"]=="invalid" and b["issues"][0]["code"]=="json.duplicate_key"' "$RUNNER_TEMP/valid-receipt.json" "$RUNNER_TEMP/invalid-receipt.json"
          cp "$RUNNER_TEMP/valid-receipt.json" "$RUNNER_TEMP/before.json"
          status=0
          "$py" interop/validate_crawl_evidence.py --schema "$contract/schema/seo-crawl-evidence/0.1.0/schema.json" --input "$contract/fixtures/valid/complete-page.json" --output "$RUNNER_TEMP/valid-receipt.json" || status=$?
          test "$status" = 1
          cmp "$RUNNER_TEMP/valid-receipt.json" "$RUNNER_TEMP/before.json"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.0
      - name: Run actual pinned TypeScript validator on identical synthetic bytes
        shell: bash
        run: |
          set -euo pipefail
          py="$RUNNER_TEMP/interop-venv/bin/python"
          producer="$RUNNER_TEMP/websitebotscroll-pinned"
          "$py" -m interop.differential prepare --producer-root "$producer" --work "$RUNNER_TEMP/diff-inputs"
          cd "$producer"
          pnpm install --frozen-lockfile
          cp "$GITHUB_WORKSPACE/interop/differential-producer.test.ts" packages/evidence-contract/test/seo-consumer-differential.test.ts
          WBS_DIFF_WORK="$RUNNER_TEMP/diff-inputs" WBS_DIFF_TS_OUTPUT="$RUNNER_TEMP/typescript-results.json" pnpm --filter @website-bot-scroll/evidence-contract exec vitest run test/seo-consumer-differential.test.ts
      - name: Compare actual producer and consumer results
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/interop-venv/bin/python" -m interop.differential compare --producer-root "$RUNNER_TEMP/websitebotscroll-pinned" --work "$RUNNER_TEMP/diff-inputs" --typescript-results "$RUNNER_TEMP/typescript-results.json" --output "$RUNNER_TEMP/differential-report.json"
      - name: Verify corrected producer manifest against independent consumer on synthetic bytes
        shell: bash
        run: |
          set -euo pipefail
          corrected="$RUNNER_TEMP/websitebotscroll-corrected"
          git init "$corrected"
          git -C "$corrected" remote add origin https://github.com/mohammadAliKeshavarzSarkar/WebsiteBotScroll.git
          git -C "$corrected" fetch --depth=1 origin 3e11019e57882c25462c43ed8706cd4a9af5d3cd
          git -C "$corrected" checkout --detach FETCH_HEAD
          test "$(git -C "$corrected" rev-parse HEAD)" = 3e11019e57882c25462c43ed8706cd4a9af5d3cd
          cd "$corrected"
          pnpm install --frozen-lockfile
          cp "$GITHUB_WORKSPACE/interop/corrected-producer-manifest.test.ts" packages/evidence-producer/test/seo-consumer-manifest.test.ts
          WBS_CORRECTED_SOURCE_FIXTURE="$RUNNER_TEMP/websitebotscroll-pinned/packages/evidence-contract/fixtures/valid/complete-page.json" \
          WBS_CORRECTED_EXCHANGE_DIR="$RUNNER_TEMP/corrected-manifest-pair" \
          WBS_CORRECTED_COMMIT=3e11019e57882c25462c43ed8706cd4a9af5d3cd \
            pnpm --filter @website-bot-scroll/evidence-producer exec vitest run test/seo-consumer-manifest.test.ts
          cd "$GITHUB_WORKSPACE"
          py="$RUNNER_TEMP/interop-venv/bin/python"
          "$py" -m interop.verify_exchange \
            --schema "$RUNNER_TEMP/websitebotscroll-pinned/packages/evidence-contract/schema/seo-crawl-evidence/0.1.0/schema.json" \
            --manifest "$RUNNER_TEMP/corrected-manifest-pair/corrected-producer.synthetic.manifest.json" \
            --evidence "$RUNNER_TEMP/corrected-manifest-pair/corrected-producer.synthetic.evidence.json" \
            --reviewed-producer-commit 3e11019e57882c25462c43ed8706cd4a9af5d3cd \
            --output "$RUNNER_TEMP/corrected-consumer-receipt.json"
          "$py" -c 'import json,sys; r=json.load(open(sys.argv[1],encoding="utf-8")); assert r["disposition"]=="candidate_for_joint_review" and r["checksum_verified"] and r["manifest_binding_verified"] and r["consumer_validation"]=="valid" and r["consumer_preflight"]["status"]=="within_profile" and r["actual_exchange_verified"] is False and r["authorization_verified"] is False and r["operational_integration_approved"] is False' "$RUNNER_TEMP/corrected-consumer-receipt.json"
          echo "Synthetic cross-repo export format accepted; no actual crawl or authorization verified."

      - name: Retain synthetic comparison receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-differential-report
          path: ${{ runner.temp }}/differential-report.json
          if-no-files-found: warn
          retention-days: 14
