name: SEO Engineering validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact public repository revision
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin https://github.com/mohammadAliKeshavarzSarkar/SEO-Engineering.git
          git fetch --depth=1 origin "$GITHUB_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Run full offline verification
        shell: bash
        run: |
          set -euo pipefail
          python3 --version
          python3 -c 'import zlib; print("zlib", zlib.ZLIB_RUNTIME_VERSION)'
          python3 scripts/verify_release.py
      - name: Verify deterministic full package
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_skill.py --out "$RUNNER_TEMP/seo-a.zip"
          python3 scripts/build_skill.py --out "$RUNNER_TEMP/seo-b.zip"
          cmp "$RUNNER_TEMP/seo-a.zip" "$RUNNER_TEMP/seo-b.zip"
          sha256sum "$RUNNER_TEMP/seo-a.zip"
      - name: Verify archive contents against exact checkout
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_package.py --archive "$RUNNER_TEMP/seo-a.zip" --report "$RUNNER_TEMP/seo-receipt.json"
      - name: Exercise relocated skill in a synthetic project
        shell: bash
        run: |
          set -euo pipefail
          project="$RUNNER_TEMP/seo installation smoke"
          mkdir -p "$project/.agents/skills" "$project/private"
          printf 'synthetic target; leave unchanged\n' > "$project/index.html"
          cp "$project/index.html" "$RUNNER_TEMP/target-before.html"
          python3 -m zipfile -e "$RUNNER_TEMP/seo-a.zip" "$project/.agents/skills"
          installed="$project/.agents/skills/seo-engineering"
          lib="$installed/references/library"
          python3 -B scripts/verify_package.py --archive "$RUNNER_TEMP/seo-a.zip" --installed "$installed" --report "$RUNNER_TEMP/install-before.json"
          cd "$project"
          # Ignore PYTHONPATH, user site and bytecode writes into the verified installation.
          python3 -E -s -B "$lib/scripts/check_docs.py"
          python3 -E -s -B "$lib/scripts/validate_research.py" --input "$lib/examples/research-handoff/sample.json" --output private/research.json
          status=0
          python3 -E -s -B "$lib/scripts/audit_technical.py" --input "$lib/examples/technical-audit/adverse.json" --artifact-root "$lib/examples/spa-build/artifacts" --output private/audit.json || status=$?
          test "$status" = 2
          python3 -E -s -B "$lib/scripts/review_release_gates.py" --input "$lib/examples/deployment-regression/sample.json" --output private/release.json
          python3 -E -s -B "$lib/scripts/review_incident.py" --input "$lib/examples/technical-incident/sample.json" --output private/incident.json
          python3 -E -s -B "$lib/examples/practice-projects/p05-capstone/run_lab.py" --out "$project/private/capstone.json"
          python3 -E -s -B - <<'PY'
          import json
          from pathlib import Path
          def load(name):
              return json.loads(Path("private", name + ".json").read_bytes())
          audit, release, incident = map(load, ("audit", "release", "incident"))
          assert audit["grouping_status"] == "rejected"
          assert audit["coverage"]["module_counts"]["failed"] == 1
          assert audit["coverage"]["module_counts"]["processed"] == 8
          assert audit["coverage"]["escalation_candidate_ids"] and audit["triage"] is None
          assert release["disposition"] == "review_optional" and not release["deployment_authorized"]
          assert incident["disposition"] == "investigate" and not incident["incident_closed"]
          assert not incident["search_recovery_established"]
          capstone = load("capstone")
          assert capstone["source_unchanged"] and capstone["disposable_copy_removed"]
          assert len(capstone["changed_files"]) == 3
          assert capstone["reports"]["html-after"]["exit_code"] == 0
          assert capstone["reports"]["gate"]["report"]["disposition"] == "hold"
          assert not capstone["actual_external_verification"] and not capstone["deployment_authorized"]
          assert {p.name for p in Path("private").iterdir()} == {"research.json", "audit.json", "release.json", "incident.json", "capstone.json"}
          assert {p.name for p in Path(".").iterdir()} == {".agents", "private", "index.html"}
          PY
          cmp index.html "$RUNNER_TEMP/target-before.html"
          python3 -B "$GITHUB_WORKSPACE/scripts/verify_package.py" --archive "$RUNNER_TEMP/seo-a.zip" --installed "$installed" --report "$RUNNER_TEMP/install-after.json"
          cmp "$RUNNER_TEMP/install-before.json" "$RUNNER_TEMP/install-after.json"
          echo "Relocated project offline acceptance passed; external agent activation not tested"
      - name: Prepare public benchmark plan (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/score_benchmark.py prepare --suite evaluations/cases.json --config evaluations/benchmark-config.example.json --out "$RUNNER_TEMP/benchmark-plan.json"
          python3 -c 'import json,sys; p=json.load(open(sys.argv[1])); assert len(p["tasks"]) == 258; assert all(set(t)=={"case_id","repeat","prompt"} for t in p["tasks"])' "$RUNNER_TEMP/benchmark-plan.json"
      - name: Stage paired public pilot workspaces (no model calls)
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - "$RUNNER_TEMP" "$GITHUB_SHA" <<'PY'
          import json, sys
          from pathlib import Path
          from scripts.control_benchmark import schedule, fingerprint
          from scripts.prepare_trial import stage, initial_ledger, check_artifacts
          from scripts.verify_package import digest
          tmp=Path(sys.argv[1]); root=Path.cwd()
          suite=json.loads((root/"evaluations/cases.json").read_bytes())
          cohort=json.loads((root/"evaluations/public-pilot.json").read_bytes())
          archive=tmp/"seo-a.zip"
          context=tmp/"pilot-context.txt";context.write_text("Fictional CI workspace; no actual model run",encoding="utf-8")
          cfg=dict(model="synthetic CI not an actual model",runtime="offline fixture",inference_settings="none",
            tool_config="none",permission_mode="read-only",skill_commit=sys.argv[2],
            archive_sha256=digest(archive.read_bytes()),launch_protocol="synthetic local staging",
            review_protocol="none in CI",suite_kind="public_regression",repeats=1,treatment="complete_toolkit",
            task_context_sha256=digest(context.read_bytes()),seed=41926,budget="equal offline",
            rubric_access_policy="omit evaluation subtree",candidate_variant="rubric_restricted")
          control=schedule(suite,cfg,cohort["case_ids"])
          assert len(control["slots"])==32
          pair=control["slots"][:2]
          receipts={s["arm"]:stage(root,suite,control,s["blind_id"],archive,context,tmp/("pilot-"+s["arm"])) for s in pair}
          baseline,skill=receipts["baseline"],receipts["skill"]
          assert set(baseline["installed_files"])=={"context.txt"}
          assert baseline["context_sha256"]==skill["context_sha256"]
          assert any(x.endswith("/evaluations/cases.json") for x in skill["omitted_archive_paths"])
          assert not any("/evaluations/" in x for x in skill["installed_files"])
          assert ".agents/skills/seo-engineering/SKILL.md" in skill["installed_files"]
          ledger=initial_ledger(control)
          assert all(x["status"]=="not_started" for x in ledger["runs"])
          artifacts=tmp/"pilot-artifacts";artifacts.mkdir()
          assert check_artifacts(control,ledger,artifacts)["verified_artifacts"]==[]
          print("TS04 pilot: 32 planned slots, two staged workspaces; zero agent executions")
          PY
      - name: Run distribution content pre-review (counts only)
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/review_distribution.py scan --archive "$RUNNER_TEMP/seo-a.zip" --out "$RUNNER_TEMP/distribution-pre-review.json"
          python3 scripts/review_distribution.py prepare-review --report "$RUNNER_TEMP/distribution-pre-review.json" --out "$RUNNER_TEMP/distribution-manual-review.json"
          python3 scripts/review_distribution.py check-review --report "$RUNNER_TEMP/distribution-pre-review.json" --review "$RUNNER_TEMP/distribution-manual-review.json" --out "$RUNNER_TEMP/distribution-review-status.json"
          python3 - "$RUNNER_TEMP" <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          tmp=Path(sys.argv[1])
          r=json.loads((tmp/"distribution-pre-review.json").read_bytes())
          status=json.loads((tmp/"distribution-review-status.json").read_bytes())
          receipt=json.loads((tmp/"seo-receipt.json").read_bytes())
          assert r["archive_sha256"]==receipt["archive_sha256"]
          assert r["summary"]["archive"]["files"]==receipt["file_count"]
          assert r["summary"]["tracked"]["files"]==len(subprocess.check_output(["git","ls-files","-z"]).split(b"\0"))-1
          assert not r["privacy_approved"] and not r["release_approved"]
          assert not status["review_record_complete"] and not status["release_approved"]
          print("Pre-review inventory complete; human privacy review and release approval pending")
          PY
      - name: Verify development version in source and archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/seo-a.zip" "$RUNNER_TEMP/seo-receipt.json" <<'PY'
          import hashlib, json, pathlib, sys, zipfile
          source = pathlib.Path("docs/01-foundations/distribution-version.json").read_bytes()
          meta = json.loads(source)
          assert meta["skill_name"] == "seo-engineering"
          assert meta["version"] == "0.3.0-dev.12"
          assert meta["status"] == "development" and meta["stable_release"] is False
          archive, receipt = map(pathlib.Path, sys.argv[1:])
          with zipfile.ZipFile(archive) as z:
              assert z.read("seo-engineering/references/library/docs/01-foundations/distribution-version.json") == source
              assert b"0.3.0-dev.12" in z.read("seo-engineering/SKILL.md")
          report = json.loads(receipt.read_bytes())
          assert report["archive_sha256"] == hashlib.sha256(archive.read_bytes()).hexdigest()
          print("Verified development snapshot:", meta["version"], report["archive_sha256"], report["file_count"], "files")
          PY
